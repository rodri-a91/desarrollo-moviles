<ion-header [translucent]="true">
  <ion-toolbar color="secondary">
    <ion-button slot="start">
      <ion-back-button defaultHref="/places"></ion-back-button>
    </ion-button>
    <ion-title>
      {{title}}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let photo of photos()">
    <ion-img [src]="photo.thumbnailUrl" style="height: 200px"></ion-img>
    <ion-card-content>
      <p>{{photo.title}}</p>
      <p>{{photo.albumId}}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
